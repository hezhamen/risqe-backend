name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '18'
  HEROKU_APP_NAME: 'risqe-backend'

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/

  deploy:
    name: Deploy to Heroku
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.12.14
        with:
          heroku_api_key: ${{secrets.HEROKU_API_KEY}}
          heroku_app_name: ${{ env.HEROKU_APP_NAME }}
          heroku_email: 'hezhamen+heroku@gmail.com'
          appdir: '.'
          usedocker: false

      - name: Wait for deployment
        run: |
          echo "Waiting for Heroku deployment to complete..."
          sleep 45

      - name: Health check
        run: |
          echo "Performing health check..."
          for i in {1..5}; do
            if curl -f -s https://risqe-backend-a3f7e1101519.herokuapp.com/ > /dev/null; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10 seconds..."
            sleep 10
          done
          echo "❌ Health check failed after 5 attempts"
          exit 1

      - name: Test OTP endpoint
        run: |
          echo "Testing OTP endpoint..."
          response=$(curl -s -X POST https://risqe-backend-a3f7e1101519.herokuapp.com/auth/phone/request \
            -H "Content-Type: application/json" \
            -d '{"phoneNumber": "+9647721270202"}')

          if echo "$response" | grep -q '"success":true'; then
            echo "✅ OTP endpoint is working!"
          else
            echo "⚠️ OTP endpoint test failed, but deployment succeeded"
            echo "Response: $response"
          fi

      - name: Deployment success notification
        if: success()
        run: |
          echo "🎉 Deployment to Heroku completed successfully!"
          echo "App URL: https://risqe-backend-a3f7e1101519.herokuapp.com/"
          echo "API Documentation: https://risqe-backend-a3f7e1101519.herokuapp.com/reference"
